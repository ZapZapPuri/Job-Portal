<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'job_list' %}">JobPortal</a>
    <div class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        {% if user.company %}
          <a class="nav-link" href="{% url 'create_job' %}">Post Job</a>
        {% else %}
          <a class="nav-link" href="{% url 'my_applications' %}">My Applications</a>
        {% endif %}
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-link nav-link">Logout</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Login</a>
        <a class="nav-link" href="{% url 'register_company' %}">Register Company</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
