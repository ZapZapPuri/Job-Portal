{% extends 'portal/base.html' %}
{% block content %}
<h2>Delete Job</h2>
<p>Are you sure you want to delete "{{ job.title }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'job_detail' job.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
